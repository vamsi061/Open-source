<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050810">
<title>REPOVAULT — repo orchestration</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23050810'/%3E%3Cpolygon points='12 4 19 8.5 19 15.5 12 20 5 15.5 5 8.5' fill='none' stroke='%2322d3ee' stroke-width='1.6'/%3E%3Ccircle cx='12' cy='12' r='2.5' fill='%2322d3ee'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================================================================
   REPOVAULT — JARVIS design system
   deep-space navy · holographic cyan · mono telemetry
   ================================================================ */
:root {
  --bg: #050810; --bg-1: #080c14; --bg-2: #0c1220;
  --card: rgba(10, 17, 30, .9); --card-hover: rgba(12, 22, 38, .95);
  --border: rgba(34, 211, 238, .14); --border-hi: rgba(34, 211, 238, .55);
  --cyan: #22d3ee; --cyan-dim: rgba(34, 211, 238, .65); --cyan-glow: rgba(34, 211, 238, .22);
  --cyan-faint: rgba(34, 211, 238, .07);
  --indigo: #818cf8; --green: #34d399; --amber: #fbbf24; --red: #f87171; --sky: #7dd3fc;
  --text-hi: #e6edf3; --text-mid: rgba(230, 237, 243, .7); --text-lo: rgba(230, 237, 243, .38);
  --text-cyan: #baf3ff;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --font-ui: 'Space Grotesk', system-ui, sans-serif;
  --radius-sm: 6px; --radius: 10px; --radius-lg: 14px;
  --shadow-glow: 0 0 32px rgba(34, 211, 238, .18);
  /* legacy aliases — app.js inline styles reference these names */
  --panel: var(--bg-1); --surface: var(--bg-2); --surface-2: rgba(12, 22, 38, .6);
  --line: var(--border); --line-strong: rgba(34, 211, 238, .35);
  --text: var(--text-hi); --muted: var(--text-lo); --teal: var(--cyan);
  --ok: var(--green); --fail: var(--red); --run: var(--sky); --brass: var(--cyan);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text-hi); font: 14px/1.55 var(--font-ui); display: flex; flex-direction: column; overflow: hidden; color-scheme: dark;
  background-image:
    radial-gradient(ellipse 80% 60% at 50% -10%, rgba(34, 211, 238, .07) 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 85% 105%, rgba(129, 140, 248, .06) 0%, transparent 60%),
    linear-gradient(rgba(34, 211, 238, .028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34, 211, 238, .028) 1px, transparent 1px);
  background-size: auto, auto, 46px 46px, 46px 46px; background-attachment: fixed; }
::selection { background: rgba(34, 211, 238, .25); }
:focus-visible { outline: 1px solid var(--cyan); outline-offset: 2px; }
input[type="checkbox"] { accent-color: var(--cyan); }
* { scrollbar-width: thin; scrollbar-color: rgba(34, 211, 238, .2) transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(34, 211, 238, .2); border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- keyframes ---------- */
@keyframes materialize { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes pulse-glow { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
@keyframes blink { 50% { opacity: .35; } }
@keyframes radar-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
/* ---------- header ---------- */
header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: rgba(8, 12, 20, .82); border-bottom: 1px solid var(--border); backdrop-filter: blur(12px); position: relative; z-index: 10; }
header::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 260px; height: 1px; background: linear-gradient(90deg, var(--border-hi), transparent); }
.brand { display: flex; align-items: center; gap: 11px; }
.logo-mark { width: 32px; height: 32px; border: 1px solid var(--border-hi); border-radius: var(--radius-sm); display: grid; place-items: center; color: var(--cyan); box-shadow: 0 0 16px var(--cyan-glow), inset 0 0 12px rgba(34, 211, 238, .08); flex-shrink: 0; }
.brand h1 { font: 700 15px/1.2 var(--font-mono); letter-spacing: .24em; color: var(--text-cyan); text-shadow: 0 0 16px rgba(34, 211, 238, .5); }
.brand small { display: block; font: 400 9.5px var(--font-mono); letter-spacing: .2em; text-transform: uppercase; color: var(--text-lo); }
.sys-status { display: flex; align-items: center; gap: 7px; font: 500 10px var(--font-mono); letter-spacing: .2em; color: var(--cyan-dim); padding: 5px 12px; border: 1px solid var(--border); border-radius: 999px; background: var(--cyan-faint); }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse-glow 1.6s ease-in-out infinite; }
#search { flex: 0 1 380px; margin-left: auto; padding: 9px 13px; font: 12px var(--font-mono); letter-spacing: .04em; background: rgba(5, 8, 16, .8); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-hi); outline: none; transition: border-color .2s, box-shadow .2s; }
#search:focus { border-color: var(--border-hi); box-shadow: 0 0 0 2px rgba(34, 211, 238, .08); }
#search::placeholder { color: var(--text-lo); }

/* ---------- buttons ---------- */
button { font: 600 11.5px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; padding: 8px 15px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text-mid); cursor: pointer; transition: background .15s, border-color .15s, box-shadow .15s, color .15s; }
button:hover:not(:disabled) { border-color: var(--border-hi); color: var(--text-cyan); background: rgba(34, 211, 238, .08); }
button:disabled { opacity: .45; cursor: default; }
button.primary { border-color: rgba(34, 211, 238, .55); background: rgba(34, 211, 238, .12); color: var(--cyan); box-shadow: 0 0 14px rgba(34, 211, 238, .12); }
button.primary:hover:not(:disabled) { background: rgba(34, 211, 238, .24); box-shadow: 0 0 24px rgba(34, 211, 238, .3); }
button.ghost { background: transparent; border-color: var(--line-strong); }
button.danger { background: transparent; border-color: rgba(248, 113, 113, .45); color: var(--red); }
button.danger:hover:not(:disabled) { background: rgba(248, 113, 113, .14); border-color: rgba(248, 113, 113, .7); color: var(--red); }

/* ---------- layout ---------- */
main { flex: 1; display: flex; min-height: 0; }
aside { width: 300px; flex-shrink: 0; background: rgba(8, 12, 20, .6); border-right: 1px solid var(--border); overflow-y: auto; backdrop-filter: blur(8px); }
.side-head { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 16px 10px; font: 500 10px var(--font-mono); letter-spacing: .22em; text-transform: uppercase; color: var(--text-lo); }
.side-head span:first-child::before { content: '//'; color: var(--cyan); opacity: .6; margin-right: 6px; }
#project-count { color: var(--cyan-dim); }
.side-filter { padding: 0 12px 12px; border-bottom: 1px solid var(--border); }
#category-filter, #pf-category { width: 100%; padding: 8px 11px; font: 11.5px var(--font-mono); letter-spacing: .04em; background: rgba(5, 8, 16, .8); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-hi); outline: none; transition: border-color .2s; }
#category-filter:focus, #pf-category:focus { border-color: var(--border-hi); }
#project-list { list-style: none; padding-bottom: 20px; }
.project { position: relative; padding: 12px 14px 12px 18px; border-bottom: 1px solid rgba(34, 211, 238, .06); cursor: pointer; animation: materialize .35s ease-out; transition: background .15s; }
.project::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: transparent; transition: background .2s, box-shadow .2s; }
.project:hover { background: rgba(12, 22, 38, .6); }
.project.active { background: var(--cyan-faint); }
.project.active::before { background: var(--cyan); box-shadow: 0 0 10px rgba(34, 211, 238, .6); }
.p-name { font: 600 13.5px var(--font-ui); color: var(--text-hi); }
.p-cat { font: 600 9px var(--font-mono); color: var(--cyan-dim); letter-spacing: .14em; text-transform: uppercase; margin-top: 2px; }
.p-purpose { color: var(--text-lo); font-size: 12px; margin-top: 2px; }
.p-tags { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font: 500 10px var(--font-mono); letter-spacing: .06em; color: var(--cyan-dim); border: 1px solid var(--border); background: rgba(34, 211, 238, .05); border-radius: 999px; padding: 1px 9px; }
.empty { color: var(--text-lo); padding: 24px 16px; text-align: center; font: 11.5px/1.7 var(--font-mono); letter-spacing: .08em; }
#detail { flex: 1; overflow-y: auto; padding: 28px 34px 130px; min-width: 0; }
.placeholder { color: var(--text-lo); text-align: center; margin-top: 100px; font: 12px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; }
.placeholder::before { content: '◇ '; color: var(--cyan-dim); }
/* ---------- detail header ---------- */
.d-head { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; position: relative; padding-top: 6px; }
.d-head::before { content: ''; position: absolute; top: 0; left: 0; width: 220px; max-width: 60vw; height: 1px; background: linear-gradient(90deg, var(--border-hi), transparent); }
.d-head h2 { font: 700 24px/1.2 var(--font-mono); letter-spacing: .06em; color: var(--text-cyan); text-shadow: 0 0 18px rgba(34, 211, 238, .35); flex: 1; min-width: 200px; }
.d-cat { display: inline-block; margin-left: 12px; vertical-align: middle; font: 500 9px var(--font-mono); letter-spacing: .16em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(34, 211, 238, .35); color: var(--cyan-dim); background: var(--cyan-faint); }
.d-actions { display: flex; gap: 8px; }
.d-purpose { color: var(--text-mid); font-size: 14px; margin-top: 6px; max-width: 75ch; }
.d-repo { margin-top: 8px; }
.d-repo a { font: 11.5px var(--font-mono); letter-spacing: .04em; color: var(--cyan-dim); text-decoration: none; border-bottom: 1px dotted rgba(34, 211, 238, .35); transition: color .2s; }
.d-repo a:hover { color: var(--cyan); }
.d-desc { opacity: .85; margin-top: 8px; max-width: 70ch; color: var(--text-mid); }
.d-tags { margin-top: 12px; display: flex; gap: 5px; flex-wrap: wrap; }

/* ---------- recipes ---------- */
section.recipes { margin-top: 32px; }
section.recipes h3 { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); font: 500 11px var(--font-mono); letter-spacing: .22em; text-transform: uppercase; color: var(--text-lo); }
section.recipes h3::before { content: '△'; color: var(--cyan); margin-right: 8px; }
.recipe { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 17px; margin-bottom: 13px; overflow: hidden; transition: border-color .25s, box-shadow .25s; animation: materialize .4s ease-out; }
.recipe::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: linear-gradient(180deg, var(--border-hi), transparent); opacity: .4; }
.recipe:hover { border-color: var(--border-hi); box-shadow: 0 0 24px rgba(34, 211, 238, .08); }
.r-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.r-title { font: 600 14px var(--font-ui); color: var(--text-hi); }
.r-spacer { flex: 1; }
.ribbon { display: inline-flex; gap: 3px; align-items: center; }
.ribbon i { width: 9px; height: 9px; border-radius: 2px; background: rgba(34, 211, 238, .18); }
.ribbon i.success { background: var(--green); box-shadow: 0 0 6px rgba(52, 211, 153, .5); }
.ribbon i.failed { background: var(--red); box-shadow: 0 0 6px rgba(248, 113, 113, .5); }
.ribbon i.running { background: var(--sky); animation: blink 1.1s ease-in-out infinite; }
.r-cmd { font: 12px/1.65 var(--font-mono); background: rgba(2, 4, 10, .85); border: 1px solid var(--border); border-left: 2px solid rgba(34, 211, 238, .4); border-radius: var(--radius-sm); padding: 10px 13px; margin: 11px 0 9px; color: var(--green); overflow-x: auto; white-space: pre-wrap; }
.r-meta { color: var(--text-lo); font: 11px var(--font-mono); letter-spacing: .04em; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.venv-chip { font: 500 10px var(--font-mono); letter-spacing: .08em; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--text-lo); background: transparent; }
.venv-chip.on { border-color: rgba(52, 211, 153, .5); color: var(--green); background: rgba(52, 211, 153, .06); }
.r-last { margin-top: 10px; font: 11px var(--font-mono); letter-spacing: .05em; color: var(--text-lo); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.r-last.clickable { cursor: pointer; }
.r-last.clickable:hover { color: var(--cyan-dim); }

/* ---------- badges ---------- */
.badge { font: 600 9.5px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; border: 1px solid; }
.badge.success { color: var(--green); border-color: rgba(52, 211, 153, .35); background: rgba(52, 211, 153, .07); }
.badge.failed { color: var(--red); border-color: rgba(248, 113, 113, .35); background: rgba(248, 113, 113, .07); }
.badge.running { color: var(--sky); border-color: rgba(125, 211, 252, .4); background: rgba(125, 211, 252, .07); animation: pulse-glow 1.4s ease-in-out infinite; }
/* ---------- output drawer ---------- */
#output-panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 50vh; background: rgba(5, 8, 16, .96); border-top: 1px solid var(--border-hi); box-shadow: 0 -8px 40px rgba(34, 211, 238, .08); display: flex; flex-direction: column; transform: translateY(103%); transition: transform .22s ease; z-index: 20; backdrop-filter: blur(12px); }
#output-panel.open { transform: none; }
.o-head { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; font: 12px var(--font-mono); letter-spacing: .06em; }
.o-head strong { color: var(--text-cyan); font-weight: 600; }
.o-meta { flex: 1; color: var(--text-lo); font: 11px var(--font-mono); letter-spacing: .08em; }
#output { flex: 1; overflow: auto; padding: 13px 20px; font: 12px/1.7 var(--font-mono); white-space: pre-wrap; color: #a5e8f4; text-shadow: 0 0 8px rgba(34, 211, 238, .15); }

/* ---------- dialogs ---------- */
/* margin:auto restores modal centering that the * reset removes; scroll inside on short viewports */
dialog { margin: auto; max-height: calc(100vh - 48px); overflow-y: auto; background: var(--bg-1); color: var(--text-hi); border: 1px solid var(--border-hi); border-radius: var(--radius-lg); padding: 24px; width: min(520px, 92vw); box-shadow: var(--shadow-glow), 0 24px 80px rgba(0, 0, 0, .6); }
dialog::backdrop { background: rgba(2, 4, 10, .72); backdrop-filter: blur(3px); }
dialog h2 { font: 600 15px var(--font-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--text-cyan); }
dialog h2::before { content: '//'; color: var(--cyan); opacity: .6; margin-right: 8px; }
dialog label { display: block; font: 500 9.5px var(--font-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--text-lo); margin: 14px 0 5px; }
dialog input, dialog textarea { width: 100%; padding: 9px 12px; font: 12.5px var(--font-mono); background: rgba(5, 8, 16, .8); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-hi); outline: none; transition: border-color .2s, box-shadow .2s; }
dialog input:focus, dialog textarea:focus { border-color: var(--border-hi); box-shadow: 0 0 0 2px rgba(34, 211, 238, .08); }
dialog textarea { font-size: 12px; min-height: 64px; resize: vertical; }
.mono { font-family: var(--font-mono) !important; }
.check-row { display: flex; align-items: center; gap: 9px; margin-top: 15px; cursor: pointer; color: var(--text-mid); font-size: 13px; }
.check-row input { width: auto; }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }

/* ---------- toast ---------- */
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(16px); opacity: 0; background: var(--bg-2); border: 1px solid var(--border-hi); color: var(--text-cyan); padding: 10px 18px; border-radius: var(--radius); font: 12px var(--font-mono); letter-spacing: .05em; pointer-events: none; transition: opacity .18s, transform .18s; z-index: 60; box-shadow: 0 0 24px rgba(34, 211, 238, .15); }
#toast.show { opacity: 1; transform: translateX(-50%); }

/* ---------- responsive & motion ---------- */
@media (max-width: 860px) {
  main { flex-direction: column; }
  aside { width: 100%; max-height: 34vh; border-right: none; border-bottom: 1px solid var(--border); }
  #detail { padding: 18px 16px 130px; }
  #search { flex: 1; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="logo-mark" aria-hidden="true">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </span>
    <h1>REPOVAULT<small>repo orchestration</small></h1>
  </div>
  <div class="sys-status" title="Supabase link"><span class="status-dot pulsing"></span>ONLINE</div>
  <input id="search" type="search" placeholder="search name, purpose, tag…" aria-label="Search projects" autocomplete="off">
  <button class="primary" id="new-project-btn">＋ New project</button>
</header>

<main>
  <aside>
    <div class="side-head"><span>Projects</span><span id="project-count"></span></div>
    <div class="side-filter">
      <select id="category-filter" aria-label="Filter by category">
        <option value="">All categories</option>
      </select>
    </div>
    <ul id="project-list"></ul>
  </aside>
  <section id="detail"><div class="placeholder">Select a project, or create one</div></section>
</main>

<section id="output-panel" aria-label="Run output">
  <div class="o-head">
    <strong id="output-title">Run</strong>
    <span id="run-status" class="badge running">running</span>
    <span class="o-meta" id="exit-code"></span>
    <button class="danger" id="kill-btn">Kill</button>
    <button class="ghost" id="close-output">Close</button>
  </div>
  <pre id="output"></pre>
</section>

<div id="toast" role="status"></div>

<dialog id="project-dialog">
  <form id="project-form">
    <h2 id="project-dlg-title">New project</h2>
    <label for="pf-name">Name *</label><input id="pf-name" name="name" required>
    <label for="pf-repo">Repo URL</label><input id="pf-repo" name="repo_url" class="mono" placeholder="https://github.com/…">
    <label for="pf-purpose">Purpose (what do you use it for?)</label><input id="pf-purpose" name="purpose" placeholder="e.g. PDF conversion, reverse proxy…">
    <label for="pf-category">Category</label><select id="pf-category" name="category_id"><option value="">— none —</option></select>
    <label for="pf-tags">Tags (comma separated)</label><input id="pf-tags" name="tags" placeholder="pdf, tools, ai">
    <div class="dlg-actions">
      <button type="button" class="ghost" id="project-cancel">Cancel</button>
      <button type="submit" class="primary">Save project</button>
    </div>
  </form>
</dialog>

<dialog id="recipe-dialog">
  <form id="recipe-form">
    <h2 id="recipe-dlg-title">New recipe</h2>
    <label for="rf-title">Title *</label><input id="rf-title" name="title" required placeholder="Start dev server">
    <label for="rf-command">Command * (one per line, run in order)</label><textarea id="rf-command" name="command" required class="mono" placeholder="python vehicle_lookup.py&#10;python export.py"></textarea>
    <label for="rf-args">Arguments (appended to the command line)</label><input id="rf-args" name="args" class="mono" placeholder="--rc=AP16DH1924">
    <label for="rf-setup">Setup (runs before the command)</label><input id="rf-setup" name="setup" class="mono" placeholder="pip install -r requirements.txt">
    <label for="rf-dir">Working directory (optional — blank = auto-clone the project's GitHub repo)</label><input id="rf-dir" name="working_dir" class="mono" placeholder="/Users/you/project (or leave blank)">
    <label for="rf-env">Env vars (KEY=value per line)</label><textarea id="rf-env" name="env" placeholder="PORT=3000"></textarea>
    <label class="check-row"><input type="checkbox" name="use_venv"> <span>Create &amp; activate <span class="mono">.venv</span> before running</span></label>
    <div class="dlg-actions">
      <button type="button" class="ghost" id="recipe-cancel">Cancel</button>
      <button type="submit" class="primary">Save recipe</button>
    </div>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
